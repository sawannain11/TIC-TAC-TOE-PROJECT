<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    <h1 id="clock"></h1>
</body>
<script>
    setInterval(function(){
        let time = new Date();
        document.getElementById("clock").innerText = time.toLocaleTimeString();
    },1000);
</script>
</html>
